<!doctype html>
<html lang="pt-BR"><head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<link rel="manifest" href="manifest.json">
<meta name="theme-color" content="#111827">
<title>Simplifiquei TEC Builder</title>
<style>
body{font-family:system-ui;background:#0f172a;color:#fff;margin:0}
header{padding:16px;background:#111827;border-bottom:3px solid #d4af37}
section{margin:16px;padding:16px;background:#1e293b;border-radius:12px}
button,.btn{background:#2563eb;color:#fff;padding:8px 12px;border:none;border-radius:8px;text-decoration:none}
table{width:100%;border-collapse:collapse}th,td{padding:8px;border-bottom:1px solid #334155}
</style></head>
<body>
<header><h1>Simplifiquei TEC Builder</h1><p>PWA instalável (protótipo)</p></header>
<section>
<h2>Treino Full Body</h2>
<table>
<tr><th>✔</th><th>Exercício</th><th>Séries</th><th>Vídeo</th></tr>
<tr><td><input type="checkbox"></td><td>Agachamento Livre</td><td>3x6-8</td><td><a class="btn" target="_blank" href="https://www.youtube.com/results?search_query=agachamento+livre">Vídeo</a></td></tr>
<tr><td><input type="checkbox"></td><td>Supino Reto</td><td>3x6-8</td><td><a class="btn" target="_blank" href="https://www.youtube.com/results?search_query=supino+reto">Vídeo</a></td></tr>
<tr><td><input type="checkbox"></td><td>Remada Curvada</td><td>3x8-10</td><td><a class="btn" target="_blank" href="https://www.youtube.com/results?search_query=remada+curvada">Vídeo</a></td></tr>
</table>
<p>Cronômetro:</p>
<div id=t>90</div>
<button onclick="go()">Iniciar 90s</button>
</section>
<script>
if('serviceWorker' in navigator){navigator.serviceWorker.register('sw.js')}
let i;function go(){let s=90;clearInterval(i);t.textContent=s;i=setInterval(()=>{t.textContent=--s;if(s<=0){clearInterval(i);alert('Descanso finalizado')}} ,1000)}
</script>
</body></html>
